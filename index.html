let currentCat = 'all';

function renderTools(filtered) {
  const cats = [...new Set(filtered.map(t=>t.cat))];
  let html = '';
  cats.forEach(cat => {
    const catTools = filtered.filter(t=>t.cat===cat);
    const catNames = {chat:'💬 对话聊天',image:'🎨 图像创作',video:'🎬 视频生成',code:'💻 编程开发',office:'📝 办公效率',audio:'🎵 音频音乐',agent:'🤖 AI Agent',search:'🔍 AI搜索引擎',design:'🎯 AI设计工具',marketing:'📢 AI营销写作',edu:'🎓 AI学习教育',data:'📊 AI数据分析'};
    html += `<div class="section" data-cat="${cat}">
      <div class="section-title"><span class="cat-icon">${catNames[cat]?.split(' ')[0]||''}</span>${catNames[cat]||cat}</div>
      <div class="grid">`;
    catTools.forEach(t => {
      const tags = (t.tags||[]).map(tg=>{
        let cls='t-tag';
        if(tg==='热'||tg==='推荐') cls+=' hot';
        if(tg==='新') cls+=' new';
        if(tg==='返佣') cls+=' commission';
        return `<span class="${cls}">${tg}</span>`;
      }).join('');
      html += `<div class="tool-card">
        <div class="t-icon">${t.icon}</div>
        <div class="t-info">
          <div class="t-name">${t.name}</div>
          <div class="t-desc">${t.desc}</div>
          <div class="t-tags">${tags}</div>
        </div>
        <a class="t-link" href="/tools/${t.name.toLowerCase().replace(/\s+/g,"-").replace(/\./g,"").replace(/·/g,"").replace(/[()]/g,"")}.html"></a>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('toolContainer').innerHTML = html;
  document.getElementById('toolCount').textContent = filtered.length;
  // Update JSON-LD structured data
  const itemList = {
    '@context':'https://schema.org',
    '@type':'ItemList',
    'itemListElement': filtered.map((t,i)=>({
      '@type':'ListItem',
      'position': i+1,
      'item': {
        '@type':'SoftwareApplication',
        'name': t.name,
        'description': t.desc,
        'url': '/tools/' + t.name.toLowerCase().replace(/\s+/g,'-').replace(/\./g,'').replace(/·/g,'').replace(/[()]/g,'') + '.html',
        'applicationCategory': 'AIApplication'
      }
    }))
  };
  document.getElementById('ld-json').textContent = JSON.stringify(itemList);
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterTools() {
  applyFilters();
}

function applyFilters() {
  let filtered = tools;
  if (currentCat !== 'all') filtered = filtered.filter(t=>t.cat===currentCat);
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (q) filtered = filtered.filter(t=>t.name.toLowerCase().includes(q)||t.desc.toLowerCase().includes(q)||t.cat.includes(q));
  renderTools(filtered);
}

renderTools(tools);
document.getElementById('toolCount').textContent = tools.length;
